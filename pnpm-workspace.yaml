packages:
  - "apps/*"
  - "packages/*"
  - "e2e/*"

nodeLinker: hoisted

# Both come from the web app and ship prebuilt binaries, so their install
# scripts aren't needed. pnpm 11 (used by EAS) fails on unreviewed builds.
allowBuilds:
  sharp: false
  unrs-resolver: false

# pnpm 11 (used by EAS) rejects packages published in the last 24h. Expo
# beta SDK bumps routinely pull in same-day @expo/* releases, and the web
# app tracks the latest Next.js release.
minimumReleaseAgeExclude:
  - "@expo/*"
  - "next"
  - "@next/*"
  - "eslint-config-next"
